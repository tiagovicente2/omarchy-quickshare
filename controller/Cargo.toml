[package]
name = "quickshare-controller"
version = "0.1.0"
edition = "2021"
authors = ["Tiago Vicente <tiagovicente2@gmail.com>"]
description = "Headless Quick Share daemon and controller for Omarchy"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
