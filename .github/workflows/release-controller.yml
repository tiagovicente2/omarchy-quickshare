name: Release controller

on:
  push:
    tags:
      - controller-v*

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/quickshare-controller-target
  CONTROLLER_ASSET: quickshare-controller-x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup update stable

      - name: Build release binary
        run: cargo build --manifest-path controller/Cargo.toml --release

      - name: Package artifact and sha256 checksum
        run: |
          mkdir -p dist
          install -D -m 0755 "$CARGO_TARGET_DIR/release/quickshare-controller" "dist/$CONTROLLER_ASSET"
          digest="$(sha256sum "dist/$CONTROLLER_ASSET")"
          printf '%s  %s\n' "${digest%% *}" "$CONTROLLER_ASSET" > "dist/$CONTROLLER_ASSET.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$CONTROLLER_ASSET" \
            "dist/$CONTROLLER_ASSET.sha256" \
            --verify-tag \
            --title "Quick Share controller ${GITHUB_REF_NAME#controller-v}" \
            --notes "Prebuilt controller binary for x86_64 Linux. SHA-256 verified."
